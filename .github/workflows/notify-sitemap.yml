# Tells the dashboard app to regenerate its committed sitemap after a docs change.
#
# Docs pages are listed in www.amezmo.com's sitemap with a <lastmod> equal to each
# page's git commit date, but that sitemap is a committed file in the separate
# rmccullagh/dashboard.amezmo.com repo. A docs edit here cannot update it directly, so on
# every push to master this fires a repository_dispatch that runs the dashboard's
# regenerate-sitemap workflow, which regenerates the sitemap and opens a PR.
#
# DASHBOARD_DISPATCH_TOKEN is a fine-grained PAT with contents:write on
# rmccullagh/dashboard.amezmo.com (the permission repository_dispatch requires).
# Nothing is checked out; gh only needs the token.

name: Notify sitemap

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  dispatch:
    name: Trigger sitemap regeneration
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch docs-updated to the dashboard repo
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_DISPATCH_TOKEN }}
        run: |
          gh api repos/rmccullagh/dashboard.amezmo.com/dispatches \
            -f event_type=docs-updated
