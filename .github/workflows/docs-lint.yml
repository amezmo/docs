name: Docs lint

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  links:
    name: Internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check that internal /docs links resolve
        run: python3 .github/scripts/check_links.py

  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install codespell
        run: sudo apt-get update && sudo apt-get install -y codespell
      - name: Run codespell
        run: codespell   # configuration lives in .codespellrc

  images:
    name: Image paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check that all Markdown images use absolute URLs
        run: python3 .github/scripts/check_image_paths.py

  backlinks:
    name: Backlinks (warn-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Report one-directional internal links (never fails)
        run: python3 .github/scripts/check_backlinks.py

  lexical:
    name: Lexical report (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/scripts/lexical-requirements.txt
      - name: Check that the lock matches lexical-requirements.in
        run: python .github/scripts/check_lexical_lock.py
      - name: Install spaCy and its English model into a virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/lexical-venv"
          "$RUNNER_TEMP/lexical-venv/bin/python" -m pip install \
            --require-hashes --no-deps -r .github/scripts/lexical-requirements.txt
      - name: Count function, content, auxiliary, and lexical verb words (never fails)
        run: '"$RUNNER_TEMP/lexical-venv/bin/python" .github/scripts/lexical_report.py'
